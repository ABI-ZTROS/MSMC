name: MSMC CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ 编译 + 测试 + 发布
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning 需要完整 Git 历史计算版本高度，浅克隆会导致 build 失败
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build main project (relaxed)
        run: dotnet build src/MSMC/MSMC.csproj --configuration Release --no-restore

      - name: Build main project (strict - warnings as errors)
        id: strict_build
        continue-on-error: true
        run: dotnet build src/MSMC/MSMC.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true -p:AnalysisMode=All

      - name: Build test project
        run: dotnet build src/MSMC.Tests/MSMC.Tests.csproj --configuration Release --no-restore

      - name: Test
        id: test
        continue-on-error: true
        run: |
          dotnet test src/MSMC.Tests/MSMC.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: src/MSMC.Tests/TestResults/

      # ═══════════════════════════════════════════════════════════════
      # 📦 双版本发布（.NET 内置单文件压缩）
      # ═══════════════════════════════════════════════════════════════
      # UPX 加壳方案已验证对 .NET 单文件 exe 无效（2026-08-02 实测）：
      #   Full 183.88 MB → 178.12 MB (-3.1%)
      #   Lite  51.41 MB →  51.32 MB (-0.2%)
      # 原因：.NET 单文件的 bundle 数据(托管代码+native libs)作为 PE overlay
      # 存在于文件末尾，UPX 只压缩 PE 主体(apphost stub ~150KB)，overlay 原样保留。
      # --overlay=copy 保留不压缩，--overlay=strip 会删除 bundle 破坏单文件。
      # 这是 UPX 的固有限制，无法绕过。
      # 改用 .NET 内置 EnableCompressionInSingleFile=true 压缩 bundle（gzip）。
      # ═══════════════════════════════════════════════════════════════

      - name: Publish Full (self-contained)
        if: success() || failure()
        run: |
          dotnet publish src/MSMC/MSMC.csproj `
            --configuration Release `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/full
        shell: pwsh

      - name: Publish Lite (framework-dependent)
        if: success() || failure()
        run: |
          dotnet publish src/MSMC/MSMC.csproj `
            --configuration Release `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -o publish/lite
        shell: pwsh

      - name: Verify Artifacts
        if: success() || failure()
        shell: pwsh
        run: |
          foreach ($variant in @("full", "lite")) {
            $exe = "publish/$variant/MSMC.exe"
            if (-not (Test-Path $exe)) {
              echo "❌ [$variant] 发布产物中找不到 MSMC.exe！"
              exit 1
            }
            $size = (Get-Item $exe).Length
            $sizeMB = [math]::Round($size/1MB, 2)
            echo "📦 [$variant] MSMC.exe 大小: $sizeMB MB"
            if ($variant -eq "full" -and $size -lt 10MB) {
              echo "❌ [full] EXE 太小 ($sizeMB MB)，自包含发布可能失败！"
              exit 1
            }
            if ($variant -eq "lite" -and $size -lt 1MB) {
              echo "❌ [lite] EXE 太小 ($sizeMB MB)，框架依赖发布可能失败！"
              exit 1
            }
            echo "✅ [$variant] 发布产物检查通过！"
          }

      # ═══════════════════════════════════════════════════════════════
      # 🗜️ 7z 极限压缩分发包
      # ═══════════════════════════════════════════════════════════════
      # UPX 对 .NET 单文件 exe 无效（PE overlay 不压缩），
      # 改用 7z LZMA2 极限压缩打包发布目录作为分发格式。
      # 用户下载 7z 解压后即可运行，无需安装器。
      #
      # 参数说明：
      # -t7z           7z 格式（比 zip 压缩率高 10-30%）
      # -mx=9          最高压缩级别
      # -m0=lzma2      LZMA2 算法（对 .NET 二进制效果好）
      # -ms=on         固实压缩（把所有文件当一个流压缩，提升比率）
      # -mf=on         过滤可执行文件（提升 PE 压缩率）
      # -mfb=273       最大字典大小（FB=273 触发 LZMA2 极限模式）
      # -mtc=off       不存储创建时间（减小元数据）
      # -mtm=off       不存储修改时间
      # -mta=off       不存储访问时间
      # ═══════════════════════════════════════════════════════════════

      - name: Install 7-Zip (Windows)
        if: success() || failure()
        shell: pwsh
        run: |
          # Windows runner 自带 7z，但路径可能不同，统一安装官方最新版
          $url = "https://www.7-zip.org/a/7z2407-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile 7z-installer.exe
          Start-Process -FilePath "7z-installer.exe" -ArgumentList "/S" -Wait
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            # 兜底：用 runner 自带的 7z
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = "7z" }
          }
          echo "7z path: $sevenZip"
          & $sevenZip --help | Select-Object -First 2
          echo "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      - name: Record pre-7z sizes
        if: success() || failure()
        id: pre_7z
        shell: pwsh
        run: |
          $fullSize = (Get-Item "publish/full/MSMC.exe").Length
          $liteSize = (Get-Item "publish/lite/MSMC.exe").Length
          $fullMB = [math]::Round($fullSize/1MB, 2)
          $liteMB = [math]::Round($liteSize/1MB, 2)
          echo "full_pre_bytes=$fullSize" >> $env:GITHUB_OUTPUT
          echo "lite_pre_bytes=$liteSize" >> $env:GITHUB_OUTPUT
          echo "full_pre_mb=$fullMB" >> $env:GITHUB_OUTPUT
          echo "lite_pre_mb=$liteMB" >> $env:GITHUB_OUTPUT
          echo "📊 Pre-7z sizes: Full=$fullMB MB, Lite=$liteMB MB"

      - name: 7z compress Full (LZMA2 ultra)
        if: success() || failure()
        shell: pwsh
        run: |
          & $env:SEVEN_ZIP a -t7z -mx=9 -m0=lzma2 -ms=on -mf=on -mfb=273 `
            -mtc=off -mtm=off -mta=off -mmt=on `
            "MSMC-win-x64-full.7z" "publish/full/*"
          if ($LASTEXITCODE -ne 0) {
            echo "❌ [full] 7z 压缩失败！"
            exit 1
          }

      - name: 7z compress Lite (LZMA2 ultra)
        if: success() || failure()
        shell: pwsh
        run: |
          & $env:SEVEN_ZIP a -t7z -mx=9 -m0=lzma2 -ms=on -mf=on -mfb=273 `
            -mtc=off -mtm=off -mta=off -mmt=on `
            "MSMC-win-x64-lite.7z" "publish/lite/*"
          if ($LASTEXITCODE -ne 0) {
            echo "❌ [lite] 7z 压缩失败！"
            exit 1
          }

      - name: 7z integrity test + post-7z sizes
        if: success() || failure()
        id: post_7z
        shell: pwsh
        run: |
          foreach ($variant in @("full", "lite")) {
            $archive = "MSMC-win-x64-$variant.7z"
            if (-not (Test-Path $archive)) {
              echo "❌ [$variant] 7z 包不存在！"
              exit 1
            }
            # 7z 完整性测试
            & $env:SEVEN_ZIP t $archive
            if ($LASTEXITCODE -ne 0) {
              echo "❌ [$variant] 7z 完整性测试失败！"
              exit 1
            }
            echo "✅ [$variant] 7z 完整性测试通过"
          }
          $fullSize = (Get-Item "MSMC-win-x64-full.7z").Length
          $liteSize = (Get-Item "MSMC-win-x64-lite.7z").Length
          $fullMB = [math]::Round($fullSize/1MB, 2)
          $liteMB = [math]::Round($liteSize/1MB, 2)
          $fullPre = [int64]${{ steps.pre_7z.outputs.full_pre_bytes }}
          $litePre = [int64]${{ steps.pre_7z.outputs.lite_pre_bytes }}
          $fullRatio = [math]::Round((1 - $fullSize/$fullPre)*100, 1)
          $liteRatio = [math]::Round((1 - $liteSize/$litePre)*100, 1)
          echo "full_post_bytes=$fullSize" >> $env:GITHUB_OUTPUT
          echo "lite_post_bytes=$liteSize" >> $env:GITHUB_OUTPUT
          echo "full_post_mb=$fullMB" >> $env:GITHUB_OUTPUT
          echo "lite_post_mb=$liteMB" >> $env:GITHUB_OUTPUT
          echo "full_ratio=$fullRatio" >> $env:GITHUB_OUTPUT
          echo "lite_ratio=$liteRatio" >> $env:GITHUB_OUTPUT
          echo "📊 Post-7z sizes: Full=$fullMB MB (-$fullRatio%), Lite=$liteMB MB (-$liteRatio%)"

      - name: 7z size reduction gate
        if: success() || failure()
        shell: pwsh
        run: |
          $fullRatio = [double]${{ steps.post_7z.outputs.full_ratio }}
          $liteRatio = [double]${{ steps.post_7z.outputs.lite_ratio }}
          # 期望至少 40% 压缩（.NET 二进制对 LZMA2 友好）
          if ($fullRatio -lt 40) {
            echo "⚠️ [full] 7z 压缩率仅 $fullRatio%（期望 >=40%）"
          }
          if ($liteRatio -lt 40) {
            echo "⚠️ [lite] 7z 压缩率仅 $liteRatio%（期望 >=40%）"
          }
          if ($fullRatio -ge 40 -and $liteRatio -ge 40) {
            echo "✅ 7z 压缩率达标: Full=$fullRatio%, Lite=$liteRatio%"
          }

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $fullPre = "${{ steps.pre_7z.outputs.full_pre_mb }}"
          $fullPost = "${{ steps.post_7z.outputs.full_post_mb }}"
          $fullRatio = "${{ steps.post_7z.outputs.full_ratio }}"
          $litePre = "${{ steps.pre_7z.outputs.lite_pre_mb }}"
          $litePost = "${{ steps.post_7z.outputs.lite_post_mb }}"
          $liteRatio = "${{ steps.post_7z.outputs.lite_ratio }}"
          echo "## 🗜️ 7z 极限压缩报告" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "参数: -t7z -mx=9 -m0=lzma2 -ms=on -mf=on -mfb=273" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| 版本 | Pre-7z (EXE) | Post-7z (7z) | 压缩率 |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Full (self-contained) | $fullPre MB | $fullPost MB | -$fullRatio% |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Lite (framework-dependent) | $litePre MB | $litePost MB | -$liteRatio% |" >> $env:GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════════════════════════
      # 🎁 7z 自解压 SFX exe（双击即用，无需预装 7z）
      # ═══════════════════════════════════════════════════════════════
      # 用 7zSD.sfx 安装器 stub + config.txt 实现：
      #   双击 SFX exe → 解压到 %TEMP%\7zSxxxx.tmp\ → 运行 MSMC.exe
      #   → MSMC.exe 退出后自动清理临时目录
      #
      # 7zSD.sfx 不在标准 7-Zip 安装目录，需从 7z_extra 包获取：
      #   https://www.7-zip.org/a/7z2501-extra.7z
      # 7zSD.sfx ~140KB（动态链接 MSVCRT，所有现代 Windows 自带）
      #
      # 创建 SFX 必须用 copy /b 二进制拼接（不能用 7z -sfx）：
      #   copy /b 7zSD.sfx + config.txt + archive.7z output.exe
      # ═══════════════════════════════════════════════════════════════

      - name: Download 7zSD.sfx stub
        if: success() || failure()
        shell: pwsh
        run: |
          # 7z_extra 包含 7zSD.sfx（标准 7-Zip 安装目录没有）
          # 7z 23.x 在 bin/ 下，7z 24.x 可能直接在根目录，用通配符搜索兜底
          $url = "https://www.7-zip.org/a/7z2501-extra.7z"
          Invoke-WebRequest -Uri $url -OutFile 7z-extra.7z
          & $env:SEVEN_ZIP x 7z-extra.7z -o7z-extra -y
          # 通配符搜索 7zSD.sfx（不依赖具体目录结构）
          $sfxStub = Get-ChildItem -Path 7z-extra -Filter "7zSD.sfx" -Recurse | Select-Object -First 1
          if (-not $sfxStub) {
            echo "❌ 7zSD.sfx 未找到！7z-extra 包目录结构："
            Get-ChildItem -Path 7z-extra -Recurse | Select-Object FullName
            exit 1
          }
          $sfxPath = $sfxStub.FullName
          $stubSize = [math]::Round($sfxStub.Length/1KB, 1)
          echo "✅ 7zSD.sfx 已下载 ($stubSize KB): $sfxPath"
          echo "SFX_STUB=$sfxPath" >> $env:GITHUB_ENV

      - name: Write SFX config.txt (UTF-8 no BOM)
        if: success() || failure()
        shell: pwsh
        run: |
          # config.txt 必须是 UTF-8 无 BOM 编码
          # 省略 BeginPrompt → 不弹确认框
          # Progress 默认 yes → 显示进度条
          # Directory="%%T" → 工作目录=临时解压目录（避免 WPF 依赖 CWD）
          # 不写 InstallPath → 自动用 %TEMP% 并在退出后清理
          $cfg = @"
          ;!@Install@!UTF-8!
          Title="MSMC - Minecraft Server Management Client"
          RunProgram="MSMC.exe"
          Directory="%%T"
          ;!@InstallEnd@!
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD/config.txt", $cfg, $utf8NoBom)
          echo "✅ config.txt 已写入（UTF-8 无 BOM）"
          Get-Content config.txt

      - name: Assemble SFX exe (Full + Lite)
        if: success() || failure()
        id: sfx
        shell: pwsh
        run: |
          foreach ($variant in @("full", "lite")) {
            $archive = "MSMC-win-x64-$variant.7z"
            $output = "MSMC-win-x64-$variant-sfx.exe"
            # copy /b 二进制拼接：stub + config.txt + archive.7z
            cmd /c copy /b `"$env:SFX_STUB`" + `"$PWD\config.txt`" + `"$archive`" `"$output`"
            if (-not (Test-Path $output)) {
              echo "❌ [$variant] SFX exe 创建失败！"
              exit 1
            }
            $size = (Get-Item $output).Length
            $sizeMB = [math]::Round($size/1MB, 2)
            echo "🎁 [$variant] SFX exe 大小: $sizeMB MB"
            echo "$($variant)_sfx_mb=$sizeMB" >> $env:GITHUB_OUTPUT
          }

      - name: SFX summary
        if: always()
        shell: pwsh
        run: |
          $fullSfx = "${{ steps.sfx.outputs.full_sfx_mb }}"
          $liteSfx = "${{ steps.sfx.outputs.lite_sfx_mb }}"
          echo "## 🎁 7z SFX 自解压 exe 报告" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "用户双击 SFX exe → 自动解压到 %TEMP% → 运行 MSMC.exe → 退出后清理" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| 版本 | SFX exe 体积 |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Full (self-contained) | $fullSfx MB |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Lite (framework-dependent) | $liteSfx MB |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Full Artifact (EXE, self-contained)
        if: success() || failure()
        id: upload-full
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-full
          path: publish/full/
          retention-days: 30

      - name: Upload Lite Artifact (EXE, framework-dependent)
        if: success() || failure()
        id: upload-lite
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-lite
          path: publish/lite/
          retention-days: 30

      - name: Upload Full 7z Archive (LZMA2 ultra compressed)
        if: success() || failure()
        id: upload-full-7z
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-full-7z
          path: MSMC-win-x64-full.7z
          retention-days: 30

      - name: Upload Lite 7z Archive (LZMA2 ultra compressed)
        if: success() || failure()
        id: upload-lite-7z
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-lite-7z
          path: MSMC-win-x64-lite.7z
          retention-days: 30

      - name: Upload Full SFX exe (self-extracting, double-click to run)
        if: success() || failure()
        id: upload-full-sfx
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-full-sfx
          path: MSMC-win-x64-full-sfx.exe
          retention-days: 30

      - name: Upload Lite SFX exe (self-extracting, double-click to run)
        if: success() || failure()
        id: upload-lite-sfx
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-lite-sfx
          path: MSMC-win-x64-lite-sfx.exe
          retention-days: 30

      - name: Artifact upload fallback notice
        if: steps.upload-full.outcome == 'failure' || steps.upload-lite.outcome == 'failure' || steps.upload-full-7z.outcome == 'failure' || steps.upload-lite-7z.outcome == 'failure' || steps.upload-full-sfx.outcome == 'failure' || steps.upload-lite-sfx.outcome == 'failure'
        shell: pwsh
        run: |
          echo "⚠️ 部分产物上传失败（可能是 GitHub 网络问题 ECONNRESET）"
          echo "   构建本身已成功，产物已通过 Verify Artifacts 检查"
          echo "   可重新运行 CI 或从 Release 页面下载"

      - name: Final status check
        if: steps.test.outcome != 'success'
        shell: pwsh
        run: |
          echo "❌ 测试未通过，请查看 test-results 产物中的详细报告"
          exit 1

  audit:
    name: 🔍 代码质量检查
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning 需要完整 Git 历史计算版本高度
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Code Format Check
        continue-on-error: true
        run: |
          dotnet format --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) {
            echo "⚠️ 代码格式有差异，建议运行 dotnet format 修复（不阻断构建）"
          } else {
            echo "✅ 代码格式检查通过"
          }
        shell: pwsh

      - name: Code Quality Scan
        continue-on-error: true
        shell: pwsh
        run: |
          $issues = @()

          $notImpl = Get-ChildItem -Path "src/MSMC" -Filter "*.cs" -Recurse | Select-String -Pattern "throw new NotImplementedException"
          if ($notImpl) {
            Write-Host "⚠️ 发现 NotImplementedException（空壳代码）："
            $notImpl | ForEach-Object { Write-Host "  $($_.FileName):$($_.LineNumber)" }
            $issues += "NotImplementedException: $($notImpl.Count) 处"
          }

          $todos = Get-ChildItem -Path "src/MSMC" -Filter "*.cs" -Recurse | Select-String -Pattern "//\s*TODO"
          if ($todos) {
            Write-Host "ℹ️ 发现 TODO 注释："
            $todos | ForEach-Object { Write-Host "  $($_.FileName):$($_.LineNumber) - $($_.Line.Trim())" }
            $issues += "TODO: $($todos.Count) 处"
          }

          $emptyCatch = 0
          Get-ChildItem -Path "src/MSMC" -Filter "*.cs" -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'catch\s*\([^)]*\)\s*\{\s*(?:\/\/[^\n]*\s*)*\}') {
              Write-Host "⚠️ 发现空 catch 块: $($_.FullName)"
              $emptyCatch++
            }
          }
          if ($emptyCatch -gt 0) { $issues += "空 catch 块: $emptyCatch 处" }

          if ($issues.Count -eq 0) {
            Write-Host "✅ 代码质量扫描通过！"
          } else {
            Write-Host "📊 扫描发现：$($issues -join ', ')"
          }

      - name: Security Vulnerability Scan (direct)
        continue-on-error: true
        run: |
          $direct = dotnet list package --vulnerable 2>$null | Out-String
          echo $direct
          if ($direct -match "has the following vulnerable packages") {
            echo "⚠️ 直接依赖中发现安全漏洞（不阻断 CI）"
          } else {
            echo "✅ 直接依赖安全扫描通过！"
          }
        shell: pwsh

      - name: Security Vulnerability Scan (transitive)
        continue-on-error: true
        run: |
          $transitive = dotnet list package --vulnerable --include-transitive 2>$null | Out-String
          echo $transitive
          if ($transitive -match "has the following vulnerable packages") {
            echo "⚠️ 传递依赖中发现安全漏洞（不阻断 CI）"
          } else {
            echo "✅ 传递依赖安全扫描通过！"
          }
        shell: pwsh
