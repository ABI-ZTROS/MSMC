name: MSMC CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ 编译 + 测试 + 发布
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning 需要完整 Git 历史计算版本高度，浅克隆会导致 build 失败
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build main project (relaxed)
        run: dotnet build src/MSMC/MSMC.csproj --configuration Release --no-restore

      - name: Build main project (strict - warnings as errors)
        id: strict_build
        continue-on-error: true
        run: dotnet build src/MSMC/MSMC.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true -p:AnalysisMode=All

      - name: Build test project
        run: dotnet build src/MSMC.Tests/MSMC.Tests.csproj --configuration Release --no-restore

      - name: Test
        id: test
        continue-on-error: true
        run: |
          dotnet test src/MSMC.Tests/MSMC.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: src/MSMC.Tests/TestResults/

      # ═══════════════════════════════════════════════════════════════
      # 📦 双版本发布 + UPX 加壳压缩
      # ═══════════════════════════════════════════════════════════════
      # 策略：Full 版禁用 .NET 内置压缩(EnableCompressionInSingleFile=false)，
      # 让 UPX 接管压缩——单层 UPX 比双重压缩(gzip+UPX)体积更小且启动更快。
      # Lite 版本来就没有 EnableCompressionInSingleFile(框架依赖模式不支持)，
      # 直接 UPX 压缩即可。
      # ═══════════════════════════════════════════════════════════════

      - name: Publish Full (self-contained, pre-UPX)
        if: success() || failure()
        run: |
          dotnet publish src/MSMC/MSMC.csproj `
            --configuration Release `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=false `
            -o publish/full
        shell: pwsh

      - name: Publish Lite (framework-dependent, pre-UPX)
        if: success() || failure()
        run: |
          dotnet publish src/MSMC/MSMC.csproj `
            --configuration Release `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -o publish/lite
        shell: pwsh

      - name: Verify Artifacts (pre-UPX)
        if: success() || failure()
        shell: pwsh
        run: |
          foreach ($variant in @("full", "lite")) {
            $exe = "publish/$variant/MSMC.exe"
            if (-not (Test-Path $exe)) {
              echo "❌ [$variant] 发布产物中找不到 MSMC.exe！"
              exit 1
            }
            $size = (Get-Item $exe).Length
            $sizeMB = [math]::Round($size/1MB, 2)
            echo "📦 [$variant] pre-UPX MSMC.exe 大小: $sizeMB MB"
            if ($variant -eq "full" -and $size -lt 10MB) {
              echo "❌ [full] EXE 太小 ($sizeMB MB)，自包含发布可能失败！"
              exit 1
            }
            if ($variant -eq "lite" -and $size -lt 1MB) {
              echo "❌ [lite] EXE 太小 ($sizeMB MB)，框架依赖发布可能失败！"
              exit 1
            }
            echo "✅ [$variant] 发布产物检查通过！"
          }

      # ═══════════════════════════════════════════════════════════════
      # 🗜️ UPX 加壳压缩
      # ═══════════════════════════════════════════════════════════════
      # UPX 5.2.0 + --best --force --overlay=copy --no-lzma
      # - --force: .NET 单文件含特殊节，UPX 默认会拒绝，需强制
      # - --overlay=copy: 保留 .NET bundle 尾部数据（禁止 strip，会破坏单文件）
      # - --no-lzma: 避免 LZMA 慢解压拖累 .NET 冷启动（已有 bundle 解压开销）
      # - --compress-icons=0: WPF exe 含图标，避免资源节问题
      # - --no-antidebug: 不写反调试 stub，降低 AV 误报概率
      # ═══════════════════════════════════════════════════════════════

      - name: Install UPX 5.2.0
        if: success() || failure()
        shell: pwsh
        run: |
          $url = "https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx-extract -Force
          $upxExe = Get-ChildItem -Path upx-extract -Filter "upx.exe" -Recurse | Select-Object -First 1
          Copy-Item $upxExe.FullName -Destination "$env:GITHUB_WORKSPACE/upx.exe"
          & "$env:GITHUB_WORKSPACE/upx.exe" --version | Select-Object -First 1
          echo "UPX installed to $env:GITHUB_WORKSPACE/upx.exe"

      - name: Record pre-UPX sizes
        if: success() || failure()
        id: pre_upx
        shell: pwsh
        run: |
          $fullSize = (Get-Item "publish/full/MSMC.exe").Length
          $liteSize = (Get-Item "publish/lite/MSMC.exe").Length
          $fullMB = [math]::Round($fullSize/1MB, 2)
          $liteMB = [math]::Round($liteSize/1MB, 2)
          echo "full_pre_bytes=$fullSize" >> $env:GITHUB_OUTPUT
          echo "lite_pre_bytes=$liteSize" >> $env:GITHUB_OUTPUT
          echo "full_pre_mb=$fullMB" >> $env:GITHUB_OUTPUT
          echo "lite_pre_mb=$liteMB" >> $env:GITHUB_OUTPUT
          echo "📊 Pre-UPX sizes: Full=$fullMB MB, Lite=$liteMB MB"

      - name: UPX compress Full
        if: success() || failure()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/upx.exe" `
            --best --force --overlay=copy --no-lzma `
            --compress-icons=0 --compress-exports=0 --no-antidebug --no-color `
            "publish/full/MSMC.exe"

      - name: UPX compress Lite
        if: success() || failure()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/upx.exe" `
            --best --force --overlay=copy --no-lzma `
            --compress-icons=0 --compress-exports=0 --no-antidebug --no-color `
            "publish/lite/MSMC.exe"

      - name: UPX integrity test + post-UPX sizes
        if: success() || failure()
        id: post_upx
        shell: pwsh
        run: |
          foreach ($variant in @("full", "lite")) {
            $exe = "publish/$variant/MSMC.exe"
            # UPX 完整性测试（验证压缩数据可还原）
            & "$env:GITHUB_WORKSPACE/upx.exe" -t $exe
            if ($LASTEXITCODE -ne 0) {
              echo "❌ [$variant] UPX 完整性测试失败！"
              exit 1
            }
            # 列出压缩信息（确认壳已应用）
            echo "📋 [$variant] UPX 压缩信息:"
            & "$env:GITHUB_WORKSPACE/upx.exe" -l $exe
          }
          $fullSize = (Get-Item "publish/full/MSMC.exe").Length
          $liteSize = (Get-Item "publish/lite/MSMC.exe").Length
          $fullMB = [math]::Round($fullSize/1MB, 2)
          $liteMB = [math]::Round($liteSize/1MB, 2)
          $fullPre = [int64]${{ steps.pre_upx.outputs.full_pre_bytes }}
          $litePre = [int64]${{ steps.pre_upx.outputs.lite_pre_bytes }}
          $fullRatio = [math]::Round((1 - $fullSize/$fullPre)*100, 1)
          $liteRatio = [math]::Round((1 - $liteSize/$litePre)*100, 1)
          echo "full_post_bytes=$fullSize" >> $env:GITHUB_OUTPUT
          echo "lite_post_bytes=$liteSize" >> $env:GITHUB_OUTPUT
          echo "full_post_mb=$fullMB" >> $env:GITHUB_OUTPUT
          echo "lite_post_mb=$liteMB" >> $env:GITHUB_OUTPUT
          echo "full_ratio=$fullRatio" >> $env:GITHUB_OUTPUT
          echo "lite_ratio=$liteRatio" >> $env:GITHUB_OUTPUT
          echo "📊 Post-UPX sizes: Full=$fullMB MB (-$fullRatio%), Lite=$liteMB MB (-$liteRatio%)"

      - name: UPX size reduction gate
        if: success() || failure()
        shell: pwsh
        run: |
          $fullRatio = [double]${{ steps.post_upx.outputs.full_ratio }}
          $liteRatio = [double]${{ steps.post_upx.outputs.lite_ratio }}
          # 期望 Full 版至少压缩 30%（禁用了 .NET 压缩，UPX 接管）
          # 期望 Lite 版至少压缩 20%（本来无 .NET 压缩，UPX 直接压）
          if ($fullRatio -lt 30) {
            echo "⚠️ [full] UPX 压缩率仅 $fullRatio%（期望 >=30%），可能 EnableCompressionInSingleFile 未正确禁用"
          }
          if ($liteRatio -lt 20) {
            echo "⚠️ [lite] UPX 压缩率仅 $liteRatio%（期望 >=20%）"
          }
          if ($fullRatio -ge 30 -and $liteRatio -ge 20) {
            echo "✅ UPX 压缩率达标: Full=$fullRatio%, Lite=$liteRatio%"
          }

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $fullPre = "${{ steps.pre_upx.outputs.full_pre_mb }}"
          $fullPost = "${{ steps.post_upx.outputs.full_post_mb }}"
          $fullRatio = "${{ steps.post_upx.outputs.full_ratio }}"
          $litePre = "${{ steps.pre_upx.outputs.lite_pre_mb }}"
          $litePost = "${{ steps.post_upx.outputs.lite_post_mb }}"
          $liteRatio = "${{ steps.post_upx.outputs.lite_ratio }}"
          echo "## 🗜️ UPX 加壳压缩报告" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| 版本 | Pre-UPX | Post-UPX | 压缩率 |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Full (self-contained) | $fullPre MB | $fullPost MB | -$fullRatio% |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Lite (framework-dependent) | $litePre MB | $litePost MB | -$liteRatio% |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Full Artifact (~70MB, self-contained)
        if: success() || failure()
        id: upload-full
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-full
          path: publish/full/
          retention-days: 30

      - name: Upload Lite Artifact (~8MB, framework-dependent)
        if: success() || failure()
        id: upload-lite
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MSMC-win-x64-lite
          path: publish/lite/
          retention-days: 30

      - name: Artifact upload fallback notice
        if: steps.upload-full.outcome == 'failure' || steps.upload-lite.outcome == 'failure'
        shell: pwsh
        run: |
          echo "⚠️ Artifact 上传失败（GitHub 网络问题 ECONNRESET）"
          echo "   构建本身已成功，产物已通过 Verify Artifacts 检查"
          echo "   可重新运行 CI 或从 Release 页面下载"

      - name: Final status check
        if: steps.test.outcome != 'success'
        shell: pwsh
        run: |
          echo "❌ 测试未通过，请查看 test-results 产物中的详细报告"
          exit 1

  audit:
    name: 🔍 代码质量检查
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning 需要完整 Git 历史计算版本高度
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Code Format Check
        continue-on-error: true
        run: |
          dotnet format --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) {
            echo "⚠️ 代码格式有差异，建议运行 dotnet format 修复（不阻断构建）"
          } else {
            echo "✅ 代码格式检查通过"
          }
        shell: pwsh

      - name: Code Quality Scan
        continue-on-error: true
        shell: pwsh
        run: |
          $issues = @()

          $notImpl = Get-ChildItem -Path "src/MSMC" -Filter "*.cs" -Recurse | Select-String -Pattern "throw new NotImplementedException"
          if ($notImpl) {
            Write-Host "⚠️ 发现 NotImplementedException（空壳代码）："
            $notImpl | ForEach-Object { Write-Host "  $($_.FileName):$($_.LineNumber)" }
            $issues += "NotImplementedException: $($notImpl.Count) 处"
          }

          $todos = Get-ChildItem -Path "src/MSMC" -Filter "*.cs" -Recurse | Select-String -Pattern "//\s*TODO"
          if ($todos) {
            Write-Host "ℹ️ 发现 TODO 注释："
            $todos | ForEach-Object { Write-Host "  $($_.FileName):$($_.LineNumber) - $($_.Line.Trim())" }
            $issues += "TODO: $($todos.Count) 处"
          }

          $emptyCatch = 0
          Get-ChildItem -Path "src/MSMC" -Filter "*.cs" -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'catch\s*\([^)]*\)\s*\{\s*(?:\/\/[^\n]*\s*)*\}') {
              Write-Host "⚠️ 发现空 catch 块: $($_.FullName)"
              $emptyCatch++
            }
          }
          if ($emptyCatch -gt 0) { $issues += "空 catch 块: $emptyCatch 处" }

          if ($issues.Count -eq 0) {
            Write-Host "✅ 代码质量扫描通过！"
          } else {
            Write-Host "📊 扫描发现：$($issues -join ', ')"
          }

      - name: Security Vulnerability Scan (direct)
        continue-on-error: true
        run: |
          $direct = dotnet list package --vulnerable 2>$null | Out-String
          echo $direct
          if ($direct -match "has the following vulnerable packages") {
            echo "⚠️ 直接依赖中发现安全漏洞（不阻断 CI）"
          } else {
            echo "✅ 直接依赖安全扫描通过！"
          }
        shell: pwsh

      - name: Security Vulnerability Scan (transitive)
        continue-on-error: true
        run: |
          $transitive = dotnet list package --vulnerable --include-transitive 2>$null | Out-String
          echo $transitive
          if ($transitive -match "has the following vulnerable packages") {
            echo "⚠️ 传递依赖中发现安全漏洞（不阻断 CI）"
          } else {
            echo "✅ 传递依赖安全扫描通过！"
          }
        shell: pwsh
