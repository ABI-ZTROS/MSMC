<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSMC 启动中</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background-color: #020617; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
      body { font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; color: #e2e8f0; overflow: hidden; }
      #root { height: 100%; }
      #boot-diagnostics {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background-color: #020617; color: #e2e8f0; padding: 24px; z-index: 9999;
        font-size: 13px; line-height: 1.6;
      }
      #boot-diagnostics .box { max-width: 480px; width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
      #boot-diagnostics h2 { margin: 0 0 8px; font-size: 14px; color: #94a3b8; font-weight: 500; }
      #boot-diagnostics .log { margin-top: 12px; padding: 10px; background: #020617; border-radius: 6px; font-family: Consolas, monospace; font-size: 11px; color: #94a3b8; max-height: 160px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
    <script type="module" crossorigin src="./assets/startup-DfGd7tyQ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-BnmTbN-o.js">
    <link rel="modulepreload" crossorigin href="./assets/icons-BChoR3AM.js">
    <link rel="modulepreload" crossorigin href="./assets/globals-DZBg3Loq.js">
    <link rel="stylesheet" crossorigin href="./assets/globals-DroXPuq_.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-diagnostics">
      <div class="box">
        <h2>MSMC 启动中...</h2>
        <div class="log" id="boot-log">[BOOT] 正在加载启动界面...</div>
      </div>
    </div>
    <script>
      (function () {
        var bootLog = document.getElementById('boot-log');
        function appendLog(msg) {
          if (bootLog) {
            var line = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
            bootLog.textContent += line;
          }
        }
        window.addEventListener('error', function (e) {
          var msg = (e.message || '未知错误') + (e.filename ? ' @ ' + e.filename + ':' + (e.lineno || 0) + ':' + (e.colno || 0) : '');
          appendLog('[ERROR] ' + msg);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason.toString())) || '未处理的 Promise 拒绝';
          appendLog('[PROMISE] ' + msg);
        });
        appendLog('[BOOT] 启动诊断脚本已就绪');
      })();
    </script>
  </body>
</html>
